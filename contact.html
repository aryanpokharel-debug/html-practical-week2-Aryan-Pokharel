<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Personal Portfolio - Contact</title>
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Feel free to contact me using the form below.</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Contact Information</h2>

            <p>
                <strong>Email:</strong>
                aryanpokharel@patan.college.edu.np
            </p>

            <p>
                <strong>Location:</strong>
                Kathmandu, Nepal
            </p>
        </section>

        <section>
            <h2>Send Me a Message</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <br><br>

                <label for="reason">Reason for Contact:</label>

                <select id="reason" name="reason">
                    <option value="general">General Question</option>
                    <option value="project">Project Discussion</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>

                <br><br>

                <label>Preferred Contact:</label>

                <input
                    type="radio"
                    id="email-contact"
                    name="contact"
                    value="email">

                <label for="email-contact">Email</label>

                <input
                    type="radio"
                    id="phone-contact"
                    name="contact"
                    value="phone">

                <label for="phone-contact">Phone</label>

                <br><br>

                <label>Topics:</label>

                <br>

                <input
                    type="checkbox"
                    id="html"
                    name="topic"
                    value="html">

                <label for="html">HTML</label>

                <br>

                <input
                    type="checkbox"
                    id="programming"
                    name="topic"
                    value="programming">

                <label for="programming">Programming</label>

                <br>

                <input
                    type="checkbox"
                    id="technology"
                    name="topic"
                    value="technology">

                <label for="technology">Technology</label>

                <br><br>

                <label for="message">Message:</label>

                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    cols="40"></textarea>

                <br><br>

                <input type="submit" value="Send Message">

            </form>
        </section>

        <section>
            <h2>My Location</h2>

            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3533.062595026152!2d85.31443607525296!3d27.684460176195717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb19b5ad9b8dff%3A0x12a4b82675e789a3!2sPatan%20College%20For%20Professional%20Studies!5e0!3m2!1sen!2snp!4v1790272660119!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Personal Portfolio</p>
    </footer>

</body>

</html>
