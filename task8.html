<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="sample logo.png">

    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
    
</head>
<body>
    <h1>My Media Hub</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/nh49oWrwFhM?si=wIL87wqD2x5nVU1L" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <p>This is embedded directly from YouTube</p>
    <br><br>
    <h2>My Local Video</h2>
    
    <video width="560" controls>

        <source src="Sample video.mp4" type="video/mp4">
        <br><br>

    </video>
    <p>This is sample video number 1</p>

    <video width="560" controls>
         <source src="Sample video 2.mp4" type="video/mp4">
        <br><br>
    </video>
    <p>This is sample video number 2</p>
    <br><br>

    <h2>My Local Audio</h2>
    <audio controls>

        <source src="Sample audio.weba" type="audio/mpeg">

    </audio>
    <p>This is the sample audio.</p>
    <br><br>

    <h3>Google Map Location</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3533.062595026152!2d85.31443607525296!3d27.684460176195717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb19b5ad9b8dff%3A0x12a4b82675e789a3!2sPatan%20College%20For%20Professional%20Studies!5e0!3m2!1sen!2snp!4v1790269976886!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
    
    </iframe>
    <p>Location of my College.</p>

    <h2>External Website</h2>
    <iframe
        src="https://pcpslife.patancollege.edu.np/"
        width="800"
        height="500"
        title="External webpage">
    </iframe>

    <h2>My PDF Document</h2>

    <embed
        src="sample pdf.pdf"
        type="application/pdf"
        width="800"
        height="600">

    








</body>
</html>
